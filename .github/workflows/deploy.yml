name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build & Deploy
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    environment:
      name: ${{ github.event_name == 'pull_request' && 'Preview' || 'Production' }}
      url: ${{ steps.deploy.outputs.deployment-url || (github.event_name == 'pull_request' && format('https://{0}.csit-site.pages.dev', github.head_ref) || 'https://csitsociety.club') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=csit-site --branch="${{ github.head_ref || github.ref_name }}" --commit-dirty=true

      - name: Comment Preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const safeBranch = branch.toLowerCase().replace(/[^a-z0-9-]/g, '-');
            const deploymentUrl = process.env.DEPLOYMENT_URL || `https://${safeBranch}.csit-site.pages.dev`;
            const issue_number = context.issue.number;

            const now = new Date();
            const nowIso = now.toISOString();
            const nowStr = now.toUTCString();
            const repoName = context.repo.repo;
            const repoUrl = `https://github.com/${context.repo.owner}/${repoName}`;
            const commitSha = context.sha.substring(0, 7);

            const avatarUrl = 'https://instagram.fmel18-1.fna.fbcdn.net/v/t51.2885-19/291788865_1052446648810639_8402624417549329982_n.jpg?efg=eyJ2ZW5jb2RlX3RhZyI6InByb2ZpbGVfcGljLmRqYW5nby4xMDgwLmMyIn0&_nc_ht=instagram.fmel18-1.fna.fbcdn.net&_nc_cat=107&_nc_oc=Q6cZ2gHG1QPJ7-2cAOhewWE-r5VWYXqOUshaBdRN1dyopq45mnrEtWeoeM-XrJSGIk6Uhkw&_nc_ohc=LaibVm5nZPUQ7kNvwFa5Q8c&_nc_gid=WqrZucee_zFmXKu46to61g&edm=AP4sbd4BAAAA&ccb=7-5&oh=00_AQI3VQ8JtiG1LNI2ihNMbbeDBbSTaLwi0lOq8dtgFAB8mQ&oe=6AB53E43&_nc_sid=7a9f4b';

            const body = [
              '<!-- [cf]: csit-site-cloudflare-deployment -->',
              `### <img src="${avatarUrl}" width="22" height="22" style="border-radius: 50%; vertical-align: middle;" alt="" /> Cloudflare Deployment`,
              '',
              'The latest updates on your projects. Powered by [Cloudflare Pages](https://pages.cloudflare.com).',
              '',
              '| Project | Deployment | Updated |',
              '| :--- | :--- | :--- |',
              `| <img src="${avatarUrl}" width="16" height="16" style="border-radius: 50%; vertical-align: middle;" alt="" /> [${repoName}](${repoUrl}) | [Preview](${deploymentUrl}) | <relative-time datetime="${nowIso}">${nowStr}</relative-time> (\`${commitSha}\`) |`
            ].join('\n');

            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
            });

            const botComment = comments.data.find(comment =>
              comment.body.includes('[cf]: csit-site-cloudflare-deployment') ||
              (comment.user.login === 'github-actions[bot]' && comment.body.includes('Cloudflare Pages'))
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue_number,
                body: body
              });
            }
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
